<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    const carasDado = 6
    const numeroElegido = 1

    function tirarDado(numCaras, numero){
        const numeroRandom = Math.floor(Math.random() * numCaras) + 1

        if(numeroRandom === numero){
            console.log("Has ganado", numeroRandom)
        }else{
            console.log("No has ganado ", numeroRandom)
        }
    }

    function calcularEstadistica(numElegido, numTiradas){
        let contador = 0;

        for(let i = 0; i < numTiradas; i++){
            let resultado = Math.floor(Math.random() * carasDado)
            if(resultado === numElegido){
                contador++;
            }
        }
        console.log("El numero escogido ha salido " + contador + " veces de " + numTiradas + " tiradas");
        console.log("Eso es un " + contador /numTiradas * 100 + "% de probabilidad")
    }

    tirarDado(6, 1)
    calcularEstadistica(5, 1000)


</script>
</body>
</html>
