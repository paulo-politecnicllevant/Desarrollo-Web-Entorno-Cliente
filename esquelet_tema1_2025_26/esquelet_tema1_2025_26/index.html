<!DOCTYPE html>
<html lang="ca">
    <head>
        <title>Examen Javascript</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/tv.css" rel="stylesheet">
    </head>
    <body>
        <div id="title">
            <h1>Examen Vanilla JS</h1>
        </div>
        <div id="timer">5</div>
        <div id="screen">
            <img src="img/tv.png" alt="tv" id="tv">
            <video autoplay loop id="program">
                <source src="videos/alldayfilms.webm" type="video/webm" id="program-source">
            </video>
        </div>
        <div id="cabinet">
            <img src="img/tvcabinet.png" alt="cabinet" id="tvcabinet">

            <div id="remote">
                <button id="anterior" class="button">&lt;&lt;</button>
                <button id="play" class="button">Play</button>
                <button id="stop" class="button">Stop</button>
                <button id="seguent" class="button">&gt;&gt;</button>
            </div>
        </div>




        <script>
            /* EXAMEN JS - ESCRIVIU AQUÍ LA VOSTRA SOLUCIÓ */
            let cronometreActiu = false;

            //Actividad a() Hacer funcionar los botones play y stop
            const video = document.getElementById('program');

            const buttonPlay = document.getElementById('play');
            buttonPlay.addEventListener('click', function () {
                video.play();
                initCronometre()
            })

            const buttonPause = document.getElementById('stop');
            buttonPause.addEventListener('click', function () {
                video.pause();
            })

            //Actividad b()
            const videos = ["alldayfilms.webm", "kidstv.webm", "natureplus.webm", "sportstv.webm", "technologytoday.webm", "xtremsports.webm"]

            function cercarIndexVideo(nom){
                const nomDepurat = nom.split("/")
                return videos.indexOf(nomDepurat[nomDepurat.length-1]);
            }

            const buttonAnterior = document.getElementById('anterior');
            buttonAnterior.addEventListener('click', function(){
                const nomVideo = document.querySelector('#program-source').src;
                let index = cercarIndexVideo(nomVideo)

                if(index === 0){
                    index = videos.length;
                }

                document.querySelector('#program-source').src = 'videos/'+videos[(index - 1) % videos.length]
                document.querySelector('#program').load(nomVideo)
            })

            const buttonSeguent = document.getElementById('seguent');
            buttonSeguent.addEventListener('click', function(){
                const nomVideo = document.querySelector('#program-source').src;
                const index = cercarIndexVideo(nomVideo)
                document.querySelector('#program-source').src = 'videos/'+videos[(index + 1) % videos.length]
                document.querySelector('#program').load(nomVideo)
            })

        </script>
    </body>
</html>
