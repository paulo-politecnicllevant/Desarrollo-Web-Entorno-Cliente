    function reemplazarVocals(vocal, cancio){

    }

    function replace(cancio, vocal){

        let finalText = ''

            if(cancio[i] === 'a' || cancio[i] === 'e', cancio[i] === 'i' || cancio[i] === 'o', cancio[i] === 'u'){
                finalText += vocal
            }else{
