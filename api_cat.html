<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="app">

</div>
<script>

    function listBreeds() {
        const capcaleras = new Headers({
            "Content-Type": "application/json",
            "x-api-key": "live_jYEjT54ZfDk3SNYHESuuyKYV2KhxlD4VBwU6obIa94I7x0tuPjZxjHSyTgDmVNF2"
        });

        const options = {
            method: 'GET',
            headers: capcaleras
        }

        const promesa = fetch("https://api.thecatapi.com/v1/breeds?limit=1000", options)

        const llista = document.createElement("ol");

        promesa.then(function (resposta) {
            return resposta.json();
        }).then( function (resposta) {
            for (let resp of resposta) {
                const list = document.createElement("li");
                list.innerHTML = resp.id;

                llista.appendChild(list);
            }
        })

        document.querySelector("#app").appendChild(llista);
    }

    function searchByBreed(breed) {

        const capcaleras = new Headers({
            "Content-Type": "application/json",
            "x-api-key": "live_jYEjT54ZfDk3SNYHESuuyKYV2KhxlD4VBwU6obIa94I7x0tuPjZxjHSyTgDmVNF2"
        });

        const options = {
            method: 'GET',
            headers: capcaleras
        }

        const promesa = fetch("https://api.thecatapi.com/v1/breeds/" + breed, options)

        let foto = document.createElement("img");
        foto.setAttribute("id", "img");

        promesa.then(function (resposta) {
            return resposta.json();
        }).then(function (resposta) {
            // console.log("a la fi", resposta);
            foto.src = resposta.image.url;
        })

        foto.style.width = "300px";
        document.querySelector("#app").appendChild(foto);
    }

    const search = document.createElement("button");
    const textBar = document.createElement("input");

    search.innerHTML = "Search";

    search.addEventListener("click", function () {
        searchByBreed(textBar.value)
    });

    document.querySelector("#app").appendChild(textBar);
    document.querySelector("#app").appendChild(search);

    listBreeds();


    function uploadCat() {

    }

</script>

</body>
</html>
